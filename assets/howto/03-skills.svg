<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <defs><style>
    text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:15px}
    .m{font-family:'Cascadia Code',Consolas,monospace;font-size:13px}
    .a{opacity:0;animation:show 10s infinite}
    .q{animation-delay:.3s}.hit{animation:hit 10s infinite}
    .lv2{animation-delay:3.4s}.lv3{animation-delay:5.4s}.done{animation-delay:7.2s}
    @keyframes show{0%{opacity:0}3%,88%{opacity:1}94%,100%{opacity:0}}
    @keyframes hit{0%,18%{fill:#2b2420;stroke:#6f625a}24%,88%{fill:#3a2a22;stroke:#D97757}100%{fill:#2b2420;stroke:#6f625a}}
  </style></defs>
  <rect width="960" height="340" rx="14" fill="#1e1a17"/>
  <text x="32" y="40" fill="#F5EDE6" font-size="18" font-weight="700">按需加载：先看描述，命中才读全文，需要才动用脚本</text>
  <g class="a q"><rect x="32" y="62" width="896" height="40" rx="10" fill="#2b2420"/>
    <text x="50" y="88" fill="#F5EDE6"><tspan fill="#D97757">&gt;</tspan>  这个函数太长了，帮我重构一下</text></g>
  <text x="32" y="134" fill="#a89a8f" font-size="13">第 1 层 · 始终可见：名称 + 描述</text>
  <rect x="32" y="144" width="200" height="56" rx="10" fill="#2b2420" stroke="#6f625a"/><text class="m" x="48" y="170" fill="#F5EDE6">brand-voice</text><text x="48" y="190" fill="#6f625a" font-size="12">统一文案语气</text>
  <rect class="hit" x="244" y="144" width="200" height="56" rx="10" stroke-width="2"/><text class="m" x="260" y="170" fill="#F5EDE6">refactor</text><text x="260" y="190" fill="#E8A87C" font-size="12">重构代码 ← 命中</text>
  <rect x="456" y="144" width="200" height="56" rx="10" fill="#2b2420" stroke="#6f625a"/><text class="m" x="472" y="170" fill="#F5EDE6">doc-generator</text><text x="472" y="190" fill="#6f625a" font-size="12">生成文档</text>
  <rect x="668" y="144" width="260" height="56" rx="10" fill="#2b2420" stroke="#6f625a"/><text class="m" x="684" y="170" fill="#F5EDE6">code-review-specialist</text><text x="684" y="190" fill="#6f625a" font-size="12">代码审查</text>
  <g class="a lv2"><text x="32" y="232" fill="#a89a8f" font-size="13">第 2 层 · 命中后：读取 SKILL.md 全文</text>
    <rect x="32" y="242" width="430" height="60" rx="10" fill="#2b2420" stroke="#D97757"/>
    <text class="m" x="48" y="266" fill="#E8A87C">refactor/SKILL.md</text><text x="48" y="290" fill="#F5EDE6" font-size="13">行为不变 · 小步迭代 · 测试先行 · 可回退</text></g>
  <g class="a lv3"><text x="498" y="232" fill="#a89a8f" font-size="13">第 3 层 · 需要时：脚本 / 模板 / 参考资料</text>
    <rect x="498" y="242" width="430" height="60" rx="10" fill="#2b2420" stroke="#D97757"/>
    <text class="m" x="514" y="266" fill="#F5EDE6">scripts/detect-smells.py</text><text class="m" x="514" y="290" fill="#F5EDE6">references/code-smells.md</text></g>
  <text class="a done" x="32" y="328" fill="#9BE39B" font-size="13">装 100 个 skill 也不会撑爆上下文 —— 没命中的只占一行描述</text>
</svg>
