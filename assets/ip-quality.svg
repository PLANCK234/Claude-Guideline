<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">IP 评分查询</title><desc id="desc">原图 IP 评分为 100 分，家庭住宅 IP。所有网络标识均已脱敏。</desc><defs><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif}</style><linearGradient id="score"><stop stop-color="#d15d43"/><stop offset=".5" stop-color="#efc64d"/><stop offset="1" stop-color="#18834e"/></linearGradient></defs><rect x="0" y="0" width="1200" height="950" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><text x="32" y="50" font-size="30" fill="#17252d" font-weight="700">IP 评分查询</text><text x="32" y="83" font-size="16" fill="#647681" font-weight="400">微信截图重绘 · 公网 IP、精确位置、运营商 / ASN、反向 DNS 已隐去</text><rect x="32" y="108" width="1136" height="72" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="153" font-size="24" fill="#17252d" font-weight="700">查询 IP：已隐去</text><text x="700" y="153" font-size="21" fill="#186c52" font-weight="600">家庭住宅 IP · ISP · 原生 IP</text><rect x="32" y="204" width="550" height="218" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="240" font-size="18" fill="#647681" font-weight="600">IP 纯净度评分</text><text x="56" y="303" font-size="52" fill="#18834e" font-weight="700">100</text><text x="179" y="297" font-size="20" fill="#18834e" font-weight="600">极度纯净</text><rect x="56" y="330" width="502" height="12" rx="6" fill="url(#score)"/><text x="56" y="366" font-size="14" fill="#647681" font-weight="400">0 高危</text><text x="558" y="366" text-anchor="end" font-size="14" fill="#647681">100 可信</text><text x="56" y="399" font-size="16" fill="#186c52" font-weight="600">截图示例值 · 注册要求 ≥ 99 分</text><rect x="606" y="204" width="562" height="218" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="240" font-size="18" fill="#647681" font-weight="600">使用场景 / 类型</text><text x="630" y="282" font-size="17" fill="#647681" font-weight="400">IP 类型</text><text x="1144" y="282" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">家庭住宅 IP</text><path d="M630 298h514" stroke="#e8edef"/><text x="630" y="328" font-size="17" fill="#647681" font-weight="400">运营商类型</text><text x="1144" y="328" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">ISP</text><path d="M630 344h514" stroke="#e8edef"/><text x="630" y="374" font-size="17" fill="#647681" font-weight="400">人机流量</text><text x="1144" y="374" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">人类 92.3% / 机器 7.7%</text><rect x="32" y="446" width="550" height="202" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="482" font-size="18" fill="#647681" font-weight="600">网络信息（脱敏）</text><text x="56" y="524" font-size="17" fill="#647681" font-weight="400">地理位置 / 运营商</text><text x="558" y="524" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><path d="M56 540h502" stroke="#e8edef"/><text x="56" y="570" font-size="17" fill="#647681" font-weight="400">ASN / 反向 DNS</text><text x="558" y="570" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><path d="M56 586h502" stroke="#e8edef"/><text x="56" y="616" font-size="17" fill="#647681" font-weight="400">原生性</text><text x="558" y="616" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">原生 IP</text><rect x="606" y="446" width="562" height="202" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="482" font-size="18" fill="#647681" font-weight="600">IP 情报 / 威胁指标</text><text x="630" y="524" font-size="17" fill="#647681" font-weight="400">风险标记</text><text x="1144" y="524" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未发现明显威胁</text><path d="M630 540h514" stroke="#e8edef"/><text x="630" y="570" font-size="17" fill="#647681" font-weight="400">滥用等级</text><text x="1144" y="570" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">极度纯净</text><path d="M630 586h514" stroke="#e8edef"/><text x="630" y="616" font-size="17" fill="#647681" font-weight="400">HTTP 蜜罐黑名单</text><text x="1144" y="616" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">纯净</text><rect x="32" y="672" width="550" height="170" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="708" font-size="18" fill="#647681" font-weight="600">技术指标</text><text x="56" y="750" font-size="17" fill="#647681" font-weight="400">Bogon / 广播</text><text x="558" y="750" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">否（公网可达）</text><path d="M56 766h502" stroke="#e8edef"/><text x="56" y="796" font-size="17" fill="#647681" font-weight="400">RPKI 状态</text><text x="558" y="796" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">Valid</text><rect x="606" y="672" width="562" height="170" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="708" font-size="18" fill="#647681" font-weight="600">风险深度检测</text><text x="630" y="750" font-size="17" fill="#647681" font-weight="400">VPN / Proxy / Tor</text><text x="1144" y="750" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到</text><path d="M630 766h514" stroke="#e8edef"/><text x="630" y="796" font-size="17" fill="#647681" font-weight="400">爬虫 / 机器人</text><text x="1144" y="796" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到</text><rect x="32" y="864" width="1136" height="64" rx="10" fill="#e7f4ed" stroke="#c5dfd1"/><text x="52" y="891" font-size="21" fill="#185b43" font-weight="700">教程注册要求：住宅 IP + IP 评分 ≥ 99 + Claude AI 信任评分 ≥ 99</text><text x="52" y="914" font-size="15" fill="#466658" font-weight="400">两项必须分别达标；第三方检测结果仅供参考，不代表 Claude 官方要求或账号安全保证。</text></svg>
