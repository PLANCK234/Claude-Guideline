<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style>
    <symbol id="cn" viewBox="0 0 30 20"><rect width="30" height="20" rx="2" fill="#DE2910"/><path d="M6 3.5l1.2 3.6h3.8l-3 2.2 1.1 3.6-3.1-2.2-3.1 2.2 1.1-3.6-3-2.2h3.8z" fill="#FFDE00"/></symbol>
    <symbol id="jp" viewBox="0 0 30 20"><rect width="30" height="20" rx="2" fill="#fff" stroke="#ddd"/><circle cx="15" cy="10" r="5.5" fill="#BC002D"/></symbol>
  </defs>
  <rect width="1000" height="400" rx="20" fill="#FBF6F1"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#3d2418">结果示例 ①：我的 IP 查询（规则模式下的分流）</text>
  <text x="40" y="72" font-size="15" fill="#7a6458">来自 ip.net.coffee，示意重绘，IP 已打码</text>

  <rect x="40" y="92" width="920" height="288" rx="14" fill="#fff" stroke="#eadfd6"/>

  <!-- 左：本机 IP -->
  <text x="66" y="126" font-size="13" fill="#999">IPV4（国内网站看到的）</text>
  <use href="#cn" x="66" y="142" width="30" height="20"/>
  <text x="106" y="160" font-size="24" font-weight="700" fill="#222">***.***.*.*</text>
  <text x="66" y="196" font-size="15" fill="#333">中国 · 本地宽带</text>
  <text x="66" y="218" font-size="12" fill="#999">家庭 / 校园宽带（ISP）</text>

  <text x="66" y="266" font-size="14" fill="#333">分流出口 IP 汇总</text>
  <rect x="66" y="280" width="190" height="42" rx="8" fill="#fff" stroke="#e3e3e3"/>
  <use href="#cn" x="80" y="291" width="27" height="18"/><text x="116" y="306" font-size="14" fill="#333" font-family="JetBrains Mono,Consolas,monospace">***.***.*.*</text>
  <rect x="268" y="280" width="190" height="42" rx="8" fill="#fff" stroke="#D97757" stroke-width="2"/>
  <use href="#jp" x="282" y="291" width="27" height="18"/><text x="318" y="306" font-size="14" fill="#333" font-family="JetBrains Mono,Consolas,monospace">***.***.*.*</text>
  <text x="66" y="350" font-size="13" fill="#2e7d32">✓ 两个出口：国内直连 + 日本节点，说明规则分流生效</text>

  <!-- 右：连通性 -->
  <text x="500" y="126" font-size="13" fill="#999">网络连通性</text>
  <g font-size="14">
    <g transform="translate(500,140)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">字节跳动</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#2e7d32">26ms</text><text x="12" y="42" font-size="11" fill="#999">直连</text>
    </g>
    <g transform="translate(650,140)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">淘宝</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#2e7d32">35ms</text><text x="12" y="42" font-size="11" fill="#999">直连</text>
    </g>
    <g transform="translate(800,140)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">微信</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#2e7d32">32ms</text><text x="12" y="42" font-size="11" fill="#999">直连</text>
    </g>
    <g transform="translate(500,206)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">GitHub</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#2e7d32">83ms</text><text x="12" y="42" font-size="11" fill="#b4533a">代理</text>
    </g>
    <g transform="translate(650,206)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">Cloudflare</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#2e7d32">81ms</text><text x="12" y="42" font-size="11" fill="#b4533a">代理</text>
    </g>
    <g transform="translate(800,206)">
      <rect width="138" height="54" rx="8" fill="#fff" stroke="#e3e3e3"/><text x="12" y="22" fill="#333">YouTube</text><text x="126" y="34" text-anchor="end" font-weight="700" fill="#5fa863">229ms</text><text x="12" y="42" font-size="11" fill="#b4533a">代理</text>
    </g>
  </g>
  <text x="500" y="300" font-size="14" fill="#5a4034">国内站点延迟 30ms 左右 → 没有绕道境外</text>
  <text x="500" y="324" font-size="14" fill="#5a4034">境外站点全部可达 → 代理节点工作正常</text>
  <text x="500" y="350" font-size="13" fill="#7a6458">若国内站点也走了日本出口，说明处于“全局模式”，请切回“规则”</text>
</svg>
