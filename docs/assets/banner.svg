<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.55" stop-color="#2b1d15"/>
      <stop offset="1" stop-color="#3d2418"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B183"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#E8A87C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .spin{transform-origin:960px 170px;animation:spin 24s linear infinite}
      .blink{animation:blink 1.1s steps(1) infinite}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes float{50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <!-- starburst mark -->
  <g class="spin" fill="#D97757">
    <g id="ray"><rect x="955" y="70" width="10" height="70" rx="5"/></g>
    <use href="#ray" transform="rotate(30 960 170)"/>
    <use href="#ray" transform="rotate(60 960 170)"/>
    <use href="#ray" transform="rotate(90 960 170)"/>
    <use href="#ray" transform="rotate(120 960 170)"/>
    <use href="#ray" transform="rotate(150 960 170)"/>
    <use href="#ray" transform="rotate(180 960 170)"/>
    <use href="#ray" transform="rotate(210 960 170)"/>
    <use href="#ray" transform="rotate(240 960 170)"/>
    <use href="#ray" transform="rotate(270 960 170)"/>
    <use href="#ray" transform="rotate(300 960 170)"/>
    <use href="#ray" transform="rotate(330 960 170)"/>
  </g>
  <circle cx="960" cy="170" r="26" fill="#1a1410"/>

  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="120" font-size="22" fill="#E8A87C" letter-spacing="6">LEARN CLAUDE CODE YOURSELF</text>
    <text x="70" y="196" font-size="76" font-weight="800" fill="url(#title)">ClaudeDIY</text>
    <text x="72" y="250" font-size="34" font-weight="600" fill="#F5EDE6">Claude Code 自学指南</text>
  </g>
  <g class="float" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="20">
    <rect x="72" y="282" width="430" height="44" rx="10" fill="#000" fill-opacity="0.35" stroke="#D97757" stroke-opacity="0.5"/>
    <text x="92" y="311" fill="#9BE39B">$</text>
    <text x="114" y="311" fill="#F5EDE6">claude "帮我读懂这个仓库"</text>
    <rect class="blink" x="452" y="295" width="11" height="20" fill="#F5EDE6"/>
  </g>
</svg>
