<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <style>
      text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.45}}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="400" rx="20" fill="#FBF6F1"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#3d2418">在哪里找到代理端口？</text>
  <text x="40" y="72" font-size="15" fill="#7a6458">Clash Verge Rev 首页的“Clash 信息”卡片（示意图，已重绘）</text>

  <!-- 卡片 -->
  <rect x="40" y="96" width="460" height="282" rx="14" fill="#fff" stroke="#eadfd6"/>
  <rect x="62" y="114" width="40" height="40" rx="9" fill="#FDEBD3"/>
  <rect x="73" y="125" width="18" height="18" rx="3" fill="none" stroke="#E8912D" stroke-width="2.2"/>
  <path d="M78 125v-4M86 125v-4M78 147v-4M86 147v-4M73 130h-4M73 138h-4M91 130h4M91 138h4" stroke="#E8912D" stroke-width="2"/>
  <text x="118" y="141" font-size="19" fill="#222">Clash 信息</text>
  <line x1="40" y1="168" x2="500" y2="168" stroke="#eee"/>
  <g font-size="15" fill="#333">
    <text x="62" y="200">内核版本</text><text x="478" y="200" text-anchor="end">Mihomo</text>
    <line x1="62" y1="216" x2="478" y2="216" stroke="#f0f0f0"/>
    <text x="62" y="248">系统代理地址</text><text x="478" y="248" text-anchor="end">127.0.0.1:7897</text>
    <line x1="62" y1="264" x2="478" y2="264" stroke="#f0f0f0"/>
    <text x="62" y="296">混合代理端口</text><text x="478" y="296" text-anchor="end" font-weight="700">7897</text>
    <line x1="62" y1="312" x2="478" y2="312" stroke="#f0f0f0"/>
    <text x="62" y="344">代理模式</text><text x="478" y="344" text-anchor="end">规则（Rule）</text>
  </g>

  <!-- 圈出端口 -->
  <ellipse class="pulse" cx="458" cy="290" rx="40" ry="20" fill="none" stroke="#c0392b" stroke-width="3"/>
  <ellipse cx="430" cy="243" rx="70" ry="17" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="5 4"/>

  <path d="M500 290 C 540 290, 545 300, 580 300" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
  <path d="M502 243 C 540 243, 545 196, 580 196" stroke="#D97757" stroke-width="2" fill="none" stroke-dasharray="5 4"/>

  <!-- 说明 -->
  <rect x="588" y="160" width="372" height="74" rx="12" fill="#F4D9C6"/>
  <text x="606" y="190" font-size="16" font-weight="700" fill="#3d2418">系统代理地址</text>
  <text x="606" y="216" font-size="14" fill="#5a4034">浏览器、桌面应用通过“系统代理”自动使用</text>

  <rect x="588" y="258" width="372" height="104" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="606" y="288" font-size="16" font-weight="700" fill="#c0392b">混合代理端口 7897 ← 记下它</text>
  <text x="606" y="314" font-size="14" fill="#5a4034">终端代理（02 章）填 http://127.0.0.1:7897</text>
  <text x="606" y="338" font-size="14" fill="#5a4034">Mixed 端口同时支持 HTTP 与 SOCKS，</text>
  <text x="606" y="356" font-size="14" fill="#5a4034">Claude Code 用的是其中的 HTTP</text>
</svg>
