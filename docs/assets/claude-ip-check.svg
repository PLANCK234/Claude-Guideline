<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Claude AI IP 风险检测</title><desc id="desc">原图 Claude AI 信任评分为 100 分，住宅出口；DNS 与 WebRTC 未检测到泄露。所有网络标识均已脱敏。</desc><defs><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif}</style><linearGradient id="score"><stop stop-color="#d15d43"/><stop offset=".5" stop-color="#efc64d"/><stop offset="1" stop-color="#18834e"/></linearGradient></defs><rect x="0" y="0" width="1200" height="1120" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><text x="32" y="50" font-size="30" fill="#17252d" font-weight="700">Claude AI IP 风险检测</text><text x="32" y="83" font-size="16" fill="#647681" font-weight="400">微信截图重绘 · 公网 IP、精确位置、运营商 / ASN、反向 DNS 已隐去</text><rect x="32" y="108" width="362" height="142" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="144" font-size="18" fill="#647681" font-weight="600">国内出口 IPv4</text><text x="56" y="186" font-size="17" fill="#647681" font-weight="400">IP / 位置 / 运营商</text><text x="370" y="186" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><rect x="418" y="108" width="362" height="142" rx="14" fill="#fff" stroke="#dce3e7"/><text x="442" y="144" font-size="18" fill="#647681" font-weight="600">Cloudflare 出口 IP</text><text x="442" y="186" font-size="17" fill="#647681" font-weight="400">检测结果</text><text x="756" y="186" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">获取失败</text><rect x="804" y="108" width="364" height="142" rx="14" fill="#fff" stroke="#dce3e7"/><text x="828" y="144" font-size="18" fill="#647681" font-weight="600">Claude AI 出口 IP</text><text x="828" y="186" font-size="17" fill="#647681" font-weight="400">IP / 位置 / 运营商</text><text x="1144" y="186" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><rect x="32" y="274" width="550" height="218" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="310" font-size="18" fill="#647681" font-weight="600">Claude AI 信任评分（Trust Score）</text><text x="56" y="373" font-size="52" fill="#18834e" font-weight="700">100</text><text x="179" y="367" font-size="20" fill="#18834e" font-weight="600">极度纯净</text><rect x="56" y="400" width="502" height="12" rx="6" fill="url(#score)"/><text x="56" y="436" font-size="14" fill="#647681" font-weight="400">0 高危</text><text x="558" y="436" text-anchor="end" font-size="14" fill="#647681">100 可信</text><text x="56" y="469" font-size="16" fill="#186c52" font-weight="600">截图示例值 · 注册要求 ≥ 99 分</text><rect x="606" y="274" width="562" height="218" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="310" font-size="18" fill="#647681" font-weight="600">Claude AI 出口 IP 属性</text><text x="630" y="352" font-size="17" fill="#647681" font-weight="400">IP 属性</text><text x="1144" y="352" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">家庭住宅 IP（ISP）</text><path d="M630 368h514" stroke="#e8edef"/><text x="630" y="398" font-size="17" fill="#647681" font-weight="400">Claude 支持地区</text><text x="1144" y="398" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">正常</text><path d="M630 414h514" stroke="#e8edef"/><text x="630" y="444" font-size="17" fill="#647681" font-weight="400">城市 / ASN / 运营商</text><text x="1144" y="444" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><rect x="32" y="516" width="550" height="292" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="552" font-size="18" fill="#647681" font-weight="600">Claude AI 出口 IP 安全检测</text><text x="56" y="594" font-size="17" fill="#647681" font-weight="400">VPN</text><text x="558" y="594" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到</text><path d="M56 610h502" stroke="#e8edef"/><text x="56" y="640" font-size="17" fill="#647681" font-weight="400">代理（Proxy）</text><text x="558" y="640" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到</text><path d="M56 656h502" stroke="#e8edef"/><text x="56" y="686" font-size="17" fill="#647681" font-weight="400">Tor</text><text x="558" y="686" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到</text><path d="M56 702h502" stroke="#e8edef"/><text x="56" y="732" font-size="17" fill="#647681" font-weight="400">机器人（Crawler）</text><text x="558" y="732" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">否</text><path d="M56 748h502" stroke="#e8edef"/><text x="56" y="778" font-size="17" fill="#647681" font-weight="400">滥用记录</text><text x="558" y="778" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">无记录</text><rect x="606" y="516" width="562" height="170" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="552" font-size="18" fill="#647681" font-weight="600">DNS 泄露检测</text><text x="630" y="594" font-size="17" fill="#647681" font-weight="400">状态</text><text x="1144" y="594" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">未检测到泄露</text><path d="M630 610h514" stroke="#e8edef"/><text x="630" y="640" font-size="17" fill="#647681" font-weight="400">DNS 出口 / 服务商</text><text x="1144" y="640" text-anchor="end" font-size="17" font-weight="600" fill="#7a8790">已隐去</text><rect x="606" y="710" width="562" height="98" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="746" font-size="18" fill="#647681" font-weight="600">WebRTC UDP 泄露检测</text><text x="630" y="788" font-size="17" fill="#647681" font-weight="400">状态</text><text x="1144" y="788" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">WebRTC 已禁用或无泄露</text><rect x="32" y="832" width="550" height="170" rx="14" fill="#fff" stroke="#dce3e7"/><text x="56" y="868" font-size="18" fill="#647681" font-weight="600">Claude 可用性检测</text><text x="56" y="910" font-size="17" fill="#647681" font-weight="400">claude.ai / anthropic.com</text><text x="558" y="910" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">正常 / 良好</text><path d="M56 926h502" stroke="#e8edef"/><text x="56" y="956" font-size="17" fill="#647681" font-weight="400">Claude 服务状态</text><text x="558" y="956" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">全部服务正常</text><rect x="606" y="832" width="562" height="170" rx="14" fill="#fff" stroke="#dce3e7"/><text x="630" y="868" font-size="18" fill="#647681" font-weight="600">如何理解示例</text><text x="630" y="910" font-size="17" fill="#647681" font-weight="400">原图检测时的信任评分</text><text x="1144" y="910" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">100 分</text><path d="M630 926h514" stroke="#e8edef"/><text x="630" y="956" font-size="17" fill="#647681" font-weight="400">注册前两项评分要求</text><text x="1144" y="956" text-anchor="end" font-size="17" font-weight="600" fill="#186c52">分别 ≥ 99 分</text><rect x="32" y="1026" width="1136" height="64" rx="10" fill="#e7f4ed" stroke="#c5dfd1"/><text x="52" y="1053" font-size="21" fill="#185b43" font-weight="700">教程注册要求：住宅 IP + IP 评分 ≥ 99 + Claude AI 信任评分 ≥ 99</text><text x="52" y="1076" font-size="15" fill="#466658" font-weight="400">两项必须分别达标；第三方检测结果仅供参考，不代表 Claude 官方要求或账号安全保证。</text></svg>
