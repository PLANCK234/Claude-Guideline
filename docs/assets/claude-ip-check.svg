<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}</style>
    <symbol id="cn" viewBox="0 0 30 20"><rect width="30" height="20" rx="2" fill="#DE2910"/><path d="M6 3.5l1.2 3.6h3.8l-3 2.2 1.1 3.6-3.1-2.2-3.1 2.2 1.1-3.6-3-2.2h3.8z" fill="#FFDE00"/></symbol>
    <symbol id="jp" viewBox="0 0 30 20"><rect width="30" height="20" rx="2" fill="#fff" stroke="#ddd"/><circle cx="15" cy="10" r="5.5" fill="#BC002D"/></symbol>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#c0392b"/><stop offset=".5" stop-color="#e8b83a"/><stop offset="1" stop-color="#2e8b3e"/></linearGradient>
  </defs>
  <rect width="1000" height="560" rx="20" fill="#FBF6F1"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#3d2418">结果示例 ②：Claude AI IP 风险检测</text>
  <text x="40" y="72" font-size="15" fill="#7a6458">来自 ip.net.coffee，示意重绘，IP 与服务商已隐去；标注为本书的解读</text>

  <!-- 三个出口 -->
  <g font-size="12">
    <rect x="40" y="92" width="296" height="92" rx="12" fill="#fff" stroke="#eadfd6"/>
    <text x="60" y="118" fill="#999">中国出口 IPV4（国内网站）</text>
    <use href="#cn" x="60" y="132" width="27" height="18"/><text x="96" y="148" font-size="20" font-weight="700" fill="#222">***.***.*.*</text>
    <text x="60" y="172" fill="#333">China · 本地运营商</text>

    <rect x="352" y="92" width="296" height="92" rx="12" fill="#fff" stroke="#eadfd6"/>
    <text x="372" y="118" fill="#999">CLOUDFLARE 出口 IP</text>
    <use href="#jp" x="372" y="132" width="27" height="18"/><text x="408" y="148" font-size="20" font-weight="700" fill="#222">***.***.*.*</text>
    <text x="372" y="172" fill="#333">Japan · Tokyo · 机房</text>

    <rect x="664" y="92" width="296" height="92" rx="12" fill="#fff" stroke="#D97757" stroke-width="2"/>
    <text x="684" y="118" fill="#D97757" font-weight="700">CLAUDE AI 出口 IP</text>
    <use href="#jp" x="684" y="132" width="27" height="18"/><text x="720" y="148" font-size="20" font-weight="700" fill="#222">***.***.*.*</text>
    <text x="684" y="172" fill="#333">Japan · Tokyo · 机房</text>
  </g>
  <text x="500" y="204" text-anchor="middle" font-size="13" fill="#2e7d32">✓ Claude 出口与 Cloudflare 出口一致，都是固定的日本节点；国内出口不同属于正常分流</text>

  <!-- 信任分 -->
  <rect x="40" y="220" width="296" height="200" rx="12" fill="#fff" stroke="#eadfd6"/>
  <text x="60" y="248" font-size="12" fill="#999">CLAUDE AI 信任评分</text>
  <text x="160" y="292" text-anchor="middle" font-size="30" font-weight="700" fill="#7cb342">53</text>
  <rect x="186" y="270" width="46" height="24" rx="12" fill="#e3ecfb"/><text x="209" y="287" text-anchor="middle" font-size="13" fill="#2f5fb3">良好</text>
  <text x="188" y="316" text-anchor="middle" font-size="12" fill="#666">该 IP 存在轻微风险</text>
  <rect x="60" y="330" width="256" height="10" rx="5" fill="url(#g)"/>
  <rect x="193" y="324" width="4" height="22" rx="2" fill="#222"/>
  <text x="60" y="360" font-size="11" fill="#999">0 高危</text><text x="316" y="360" text-anchor="end" font-size="11" fill="#999">100 可信</text>
  <line x1="60" y1="374" x2="316" y2="374" stroke="#f0f0f0"/>
  <text x="60" y="402" font-size="14" fill="#333">Claude 支持地区</text>
  <rect x="262" y="386" width="54" height="24" rx="12" fill="#d8f5e2"/><text x="289" y="403" text-anchor="middle" font-size="12" fill="#1e7a3c">正常</text>

  <!-- 安全检测 -->
  <rect x="352" y="220" width="296" height="200" rx="12" fill="#fff" stroke="#eadfd6"/>
  <text x="372" y="248" font-size="12" fill="#999">出口 IP 安全检测</text>
  <g font-size="14" fill="#333">
    <text x="372" y="282">VPN</text><rect x="560" y="266" width="68" height="24" rx="12" fill="#d8f5e2"/><text x="594" y="283" text-anchor="middle" font-size="12" fill="#1e7a3c">未检测到</text>
    <text x="372" y="316">代理（Proxy）</text><rect x="572" y="300" width="56" height="24" rx="12" fill="#fde2e4"/><text x="600" y="317" text-anchor="middle" font-size="12" fill="#c0392b">代理</text>
    <text x="372" y="350">Tor</text><rect x="560" y="334" width="68" height="24" rx="12" fill="#d8f5e2"/><text x="594" y="351" text-anchor="middle" font-size="12" fill="#1e7a3c">未检测到</text>
    <text x="372" y="384">滥用记录</text><rect x="560" y="368" width="68" height="24" rx="12" fill="#d8f5e2"/><text x="594" y="385" text-anchor="middle" font-size="12" fill="#1e7a3c">无记录</text>
  </g>
  <text x="372" y="410" font-size="11" fill="#999">IP 属性：机房 IP（Hosting）</text>

  <!-- 泄露 -->
  <rect x="664" y="220" width="296" height="200" rx="12" fill="#fff" stroke="#eadfd6"/>
  <text x="684" y="248" font-size="12" fill="#999">泄露与可用性</text>
  <g font-size="14" fill="#333">
    <text x="684" y="282">claude.ai</text><rect x="870" y="266" width="70" height="24" rx="12" fill="#d8f5e2"/><text x="905" y="283" text-anchor="middle" font-size="12" fill="#1e7a3c">正常 71ms</text>
    <text x="684" y="316">WebRTC</text><rect x="844" y="300" width="96" height="24" rx="12" fill="#d8f5e2"/><text x="892" y="317" text-anchor="middle" font-size="12" fill="#1e7a3c">已禁用/无泄露</text>
    <text x="684" y="350">DNS</text><rect x="870" y="334" width="70" height="24" rx="12" fill="#fdf0d5"/><text x="905" y="351" text-anchor="middle" font-size="12" fill="#a86b00">可能泄露</text>
    <text x="684" y="384">DNS 出口</text><text x="940" y="384" text-anchor="end" font-size="13" fill="#a86b00">中国 DNS</text>
  </g>
  <text x="684" y="410" font-size="11" fill="#999">WebRTC 已按本章第 4 节关闭</text>

  <!-- 解读 -->
  <rect x="40" y="436" width="920" height="104" rx="12" fill="#F4D9C6"/>
  <text x="60" y="464" font-size="15" font-weight="700" fill="#3d2418">怎么看这份结果</text>
  <g font-size="13.5" fill="#5a4034">
    <text x="60" y="490">• 必看：Claude 出口固定在支持地区、支持地区“正常”、无滥用记录、WebRTC 无泄露。这几项满足即可。</text>
    <text x="60" y="512">• “代理 / 机房 IP”、评分 50 分上下：普通机房节点的常态，本书第 1 节已说明不要求住宅 IP。</text>
    <text x="60" y="534">• DNS“可能泄露”：规则模式下 Clash 会用国内 DNS 解析域名来匹配规则，检测站因此看到中国 DNS，出口 IP 不受影响。</text>
  </g>
</svg>
