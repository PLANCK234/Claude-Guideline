<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <!--
    更新人数：只需修改下方 id="final" 那一行里的数字（目前为 1）。
    数字超过两位时，可把 clipPath 的 width 和后面文字的 x 适当右移。
  -->
  <defs>
    <style>
      text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
      .roll{animation:roll 2.6s cubic-bezier(.16,1,.3,1) .3s both}
      @keyframes roll{from{transform:translateY(0)}to{transform:translateY(-700px)}}
      .ring{transform-origin:150px 115px;animation:spin 14s linear infinite}
      .ring2{transform-origin:150px 115px;animation:spin 9s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .core{transform-origin:150px 115px;animation:breathe 3s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      .glow{animation:glow 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
      .burst{transform-origin:446px 118px;animation:burst 1.2s ease-out 2.6s both}
      @keyframes burst{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(1.6);opacity:0}}
      .p{animation:rise 6s linear infinite;opacity:0}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
      .fade{animation:fade 1s ease-out 2.4s both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .tw{animation:tw 2.2s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1c16"/><stop offset=".55" stop-color="#1e1a17"/><stop offset="1" stop-color="#2b1a12"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/><stop offset=".5" stop-color="#F0A060"/><stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#F5EDE6"/><stop offset=".45" stop-color="#F5EDE6"/>
      <stop offset=".5" stop-color="#FFE3C4"/><stop offset=".55" stop-color="#F5EDE6"/><stop offset="1" stop-color="#F5EDE6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/><stop offset=".5" stop-color="#F0A060"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#D97757" stop-opacity=".75"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
    <clipPath id="win"><rect x="404" y="70" width="84" height="78"/></clipPath>
  </defs>

  <rect width="1000" height="230" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="229" rx="22" fill="none" stroke="#D97757" stroke-opacity=".35"/>

  <!-- 星点 -->
  <g fill="#F5EDE6">
    <circle class="tw" cx="610" cy="40" r="1.6"/>
    <circle class="tw" cx="860" cy="58" r="1.3" style="animation-delay:.7s"/>
    <circle class="tw" cx="930" cy="160" r="1.8" style="animation-delay:1.3s"/>
    <circle class="tw" cx="300" cy="200" r="1.3" style="animation-delay:.4s"/>
    <circle class="tw" cx="760" cy="200" r="1.5" style="animation-delay:1.8s"/>
  </g>

  <!-- 上升粒子 -->
  <g fill="#F0A060">
    <circle class="p" cx="110" cy="210" r="2.2"/>
    <circle class="p" cx="190" cy="215" r="1.6" style="animation-delay:1.5s"/>
    <circle class="p" cx="150" cy="220" r="2" style="animation-delay:3s"/>
    <circle class="p" cx="440" cy="215" r="1.8" style="animation-delay:2.2s"/>
    <circle class="p" cx="700" cy="220" r="1.6" style="animation-delay:4s"/>
    <circle class="p" cx="900" cy="215" r="2" style="animation-delay:.8s"/>
  </g>

  <!-- 徽章 -->
  <circle class="glow" cx="150" cy="115" r="86" fill="url(#halo)"/>
  <circle class="ring" cx="150" cy="115" r="66" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <g class="ring2">
    <circle cx="150" cy="115" r="54" fill="none" stroke="#F0A060" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="60 280"/>
    <circle cx="204" cy="115" r="4" fill="#FFD9A8"/>
  </g>
  <g class="core">
    <circle cx="150" cy="115" r="40" fill="#D97757"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round">
      <path d="M150 93v44M128 115h44M134.5 99.5l31 31M165.5 99.5l-31 31"/>
    </g>
    <circle cx="150" cy="115" r="6" fill="#D97757"/>
  </g>

  <!-- 文案 -->
  <text x="272" y="60" font-size="14" letter-spacing="3" fill="#D97757" font-weight="600">CLAUDEDIY · COMMUNITY</text>
  <text x="272" y="138" font-size="46" font-weight="700" fill="url(#shine)">已帮助</text>

  <g clip-path="url(#win)">
    <g class="roll" font-size="72" font-weight="800" fill="url(#num)" text-anchor="middle">
      <text x="446" y="138">0</text><text x="446" y="208">3</text><text x="446" y="278">7</text>
      <text x="446" y="348">2</text><text x="446" y="418">9</text><text x="446" y="488">5</text>
      <text x="446" y="558">8</text><text x="446" y="628">4</text><text x="446" y="698">6</text>
      <text x="446" y="768">0</text>
      <text id="final" x="446" y="838">1</text>
    </g>
  </g>
  <g class="burst" stroke="#FFD9A8" stroke-width="3" stroke-linecap="round">
    <path d="M446 62v-12M446 174v12M394 118h-12M498 118h12M408 78l-8-8M484 78l8-8M408 158l-8 8M484 158l8 8"/>
  </g>

  <text x="494" y="138" font-size="46" font-weight="700" fill="url(#shine)">人用上 Claude</text>

  <rect x="272" y="160" width="560" height="3" rx="1.5" fill="url(#bar)"/>
  <text class="fade" x="272" y="192" font-size="15" fill="#a89a8f">从网络准备到第一次对话 · 每一位成功上手的读者都会被记在这里</text>
</svg>
