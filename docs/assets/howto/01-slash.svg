<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <defs><style>
    text{font-family:'Cascadia Code','JetBrains Mono',Consolas,'Microsoft YaHei',monospace;font-size:16px}
    .t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
    .a{opacity:0;animation:show 10s infinite}
    .menu{animation-delay:1.2s}.sel{animation:mv 10s infinite}
    .run{animation-delay:5.2s}.r1{animation-delay:6s}.r2{animation-delay:6.8s}.r3{animation-delay:7.6s}
    .typed{animation:type 10s steps(9) infinite;clip-path:inset(0 100% 0 0)}
    @keyframes show{0%{opacity:0}3%{opacity:1}88%{opacity:1}94%,100%{opacity:0}}
    @keyframes type{0%,10%{clip-path:inset(0 100% 0 0)}11%{clip-path:inset(0 88% 0 0)}45%,88%{clip-path:inset(0 0 0 0)}94%,100%{clip-path:inset(0 100% 0 0)}}
    @keyframes mv{0%,20%{transform:translateY(0)}26%,32%{transform:translateY(34px)}38%,88%{transform:translateY(102px)}100%{transform:translateY(0)}}
  </style></defs>
  <rect width="960" height="340" rx="14" fill="#1e1a17"/>
  <text class="t" x="32" y="40" fill="#F5EDE6" font-size="18" font-weight="700">输入 / → 选择命令 → 一个固定工作流自动执行</text>
  <rect x="32" y="64" width="420" height="48" rx="10" fill="#2b2420" stroke="#D97757"/>
  <text x="52" y="94" fill="#D97757">&gt;</text>
  <g class="typed"><text x="72" y="94" fill="#F5EDE6">/optimize</text></g>
  <g class="a menu">
    <rect x="32" y="120" width="420" height="170" rx="10" fill="#2b2420"/>
    <rect class="sel" x="38" y="126" width="408" height="30" rx="6" fill="#D97757" fill-opacity=".28"/>
    <text x="52" y="147" fill="#F5EDE6">/init      <tspan fill="#a89a8f">生成 CLAUDE.md</tspan></text>
    <text x="52" y="181" fill="#F5EDE6">/clear     <tspan fill="#a89a8f">清空上下文</tspan></text>
    <text x="52" y="215" fill="#F5EDE6">/compact   <tspan fill="#a89a8f">压缩对话</tspan></text>
    <text x="52" y="249" fill="#E8A87C">/optimize  <tspan fill="#a89a8f">自定义 · optimize.md</tspan></text>
    <text x="52" y="280" fill="#6f625a" font-size="13">内建命令 · 自定义命令 · 插件命令 · MCP 提示词</text>
  </g>
  <g class="a run">
    <rect x="500" y="64" width="428" height="226" rx="10" fill="#2b2420"/>
    <text x="520" y="96" fill="#E8A87C">● 正在执行 /optimize …</text>
  </g>
  <text class="a r1" x="520" y="140" fill="#F5EDE6">1. 扫描热点函数        <tspan fill="#9BE39B">✓</tspan></text>
  <text class="a r2" x="520" y="176" fill="#F5EDE6">2. 找出 N+1 查询        <tspan fill="#9BE39B">✓</tspan></text>
  <text class="a r3" x="520" y="212" fill="#F5EDE6">3. 给出优化建议与预估收益 <tspan fill="#9BE39B">✓</tspan></text>
  <text class="a r3 t" x="520" y="262" fill="#a89a8f" font-size="14">一次编写，以后每次输入一个斜杠就能复用</text>
</svg>
