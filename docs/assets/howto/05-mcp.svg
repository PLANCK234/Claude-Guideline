<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <defs><style>
    text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:15px}
    .m{font-family:'Cascadia Code',Consolas,monospace;font-size:12px}
    .p{animation:pk 3s linear infinite}
    .p2{animation-delay:.75s}.p3{animation-delay:1.5s}.p4{animation-delay:2.25s}
    @keyframes pk{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
    .ring{animation:ring 3s ease-in-out infinite;transform-origin:250px 180px}
    @keyframes ring{50%{transform:scale(1.06)}}
  </style></defs>
  <rect width="960" height="340" rx="14" fill="#1e1a17"/>
  <text x="32" y="40" fill="#F5EDE6" font-size="18" font-weight="700">MCP：一个标准接口，把 Claude 接到外部世界</text>
  <circle class="ring" cx="250" cy="180" r="78" fill="#3a2a22" stroke="#D97757" stroke-width="2"/>
  <text x="250" y="176" text-anchor="middle" fill="#F5EDE6" font-weight="700">Claude Code</text>
  <text x="250" y="200" text-anchor="middle" fill="#a89a8f" font-size="12">MCP 客户端</text>
  <g fill="none" stroke="#6f625a" stroke-width="2" stroke-dasharray="4 6">
    <path id="w1" d="M328 150 C 460 100, 520 84, 640 84"/><path id="w2" d="M328 170 C 460 160, 520 150, 640 150"/>
    <path id="w3" d="M328 190 C 460 200, 520 214, 640 214"/><path id="w4" d="M328 210 C 460 260, 520 278, 640 278"/>
  </g>
  <circle class="p" r="6" fill="#D97757" style="offset-path:path('M328 150 C 460 100, 520 84, 640 84')"/>
  <circle class="p p2" r="6" fill="#9BE39B" style="offset-path:path('M640 150 C 520 150, 460 160, 328 170')"/>
  <circle class="p p3" r="6" fill="#D97757" style="offset-path:path('M328 190 C 460 200, 520 214, 640 214')"/>
  <circle class="p p4" r="6" fill="#9BE39B" style="offset-path:path('M640 278 C 520 278, 460 260, 328 210')"/>
  <g>
    <rect x="640" y="62" width="288" height="44" rx="10" fill="#2b2420" stroke="#6f625a"/><text x="660" y="89" fill="#F5EDE6">GitHub <tspan class="m" fill="#a89a8f">· 查 PR / Issue</tspan></text>
    <rect x="640" y="128" width="288" height="44" rx="10" fill="#2b2420" stroke="#6f625a"/><text x="660" y="155" fill="#F5EDE6">数据库 <tspan class="m" fill="#a89a8f">· 实时查询</tspan></text>
    <rect x="640" y="192" width="288" height="44" rx="10" fill="#2b2420" stroke="#6f625a"/><text x="660" y="219" fill="#F5EDE6">浏览器 <tspan class="m" fill="#a89a8f">· 打开与截图</tspan></text>
    <rect x="640" y="256" width="288" height="44" rx="10" fill="#2b2420" stroke="#6f625a"/><text x="660" y="283" fill="#F5EDE6">Notion / Slack <tspan class="m" fill="#a89a8f">· 文档与消息</tspan></text>
  </g>
  <text x="32" y="316" fill="#6f625a" font-size="13"><tspan fill="#D97757">●</tspan> 请求   <tspan fill="#9BE39B">●</tspan> 实时数据返回</text>
</svg>
